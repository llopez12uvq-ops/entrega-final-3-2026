</head><body><div class="topbar"><div class="topbar-inner"><strong>Libro digital · Noviembre–diciembre 2026</strong><nav><a class="btn" href="index.html">Inicio</a><a class="btn" href="entrega-final.html">Cargar trabajo final</a><button class="btn primario" onclick="window.print()" type="button">Imprimir / guardar en PDF</button></nav></div></div><main class="layout"><section class="visor"><div class="visor-body"><div class="libro" id="libro"><div class="aviso">Cargando entregas...</div></div></div></section></main><script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbwrqEaAXfiSz8yhMUMedfiBfDeIIoXNmS5NZwCtA9f9BuNX98LUrQSki_exFpKK6T2BJA/exec";
const libro=document.getElementById('libro');
function e(t=''){return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function safeUrl(u){try{const x=new URL(String(u||''));return x.protocol==='https:'?x.href:''}catch{return ''}}
function page(c,m='Libro digital',n=''){return `<article class="pagina"><div class="pagina-inner">${c}</div>${n!==''?`<div class="numero">${n}</div>`:''}<div class="marca">${m}</div></article>`}
function cover(){return page(`<div class="texto"><p class="badge">Publicación colectiva · Noviembre–diciembre 2026</p><h1>Plataformas, economía y transformación digital</h1><h3>Planes de transformación digital con tecnologías habilitadoras</h3><p>Diploma de Posgrado en Negocios Digitales · Universidad Nacional de Quilmes</p><p>Trabajos finales integradores de la cursada de noviembre–diciembre de 2026.</p><p><strong>Equipo docente:</strong> Sergio Paz y Linda López</p></div>`)}
function intro(){return page(`<div class="texto"><h2>Introducción</h2><p>Esta publicación colectiva reúne los trabajos finales integradores de la asignatura. Cada producción presenta un Plan de Transformación Digital con Tecnologías Habilitadoras, aplicado a una organización o emprendimiento real o hipotético.</p><p>Las propuestas identifican un problema u oportunidad, desarrollan una intervención fundamentada y analizan su potencial de valor y sus condiciones de implementación.</p><h3>Fecha de entrega</h3><p>Trabajo Final Integrador: <strong>17 de diciembre de 2026</strong>.</p><p>Las imágenes y los enlaces complementarios, cuando están presentes, son recursos opcionales aportados por sus autores.</p></div>`,'Introducción',2)}
function media(x){let o='';for(let i=1;i<=2;i++){const u=safeUrl(x['imagen'+i]);if(u){o+=`<figure class="media"><a href="${e(u)}" target="_blank" rel="noopener noreferrer" title="Abrir imagen en una pestaña nueva"><img loading="lazy" referrerpolicy="no-referrer" src="${e(u)}" alt="${e(x['epigrafe'+i]||'Imagen complementaria del trabajo')}"></a><figcaption>${e(x['epigrafe'+i]||'Imagen complementaria')}</figcaption></figure>`}}let ls=[];for(let i=1;i<=2;i++){const u=safeUrl(x['enlace'+i]);if(u)ls.push(`<li><a target="_blank" rel="noopener noreferrer" href="${e(u)}">${e(x['enlace'+i+'_titulo']||'Abrir recurso complementario '+i)}</a></li>`)}if(ls.length)o+=`<h3>Recursos complementarios</h3><ul>${ls.join('')}</ul>`;return o}
function indice(fin){let f=fin.map((x,i)=>`<div class="sumario"><div><a href="#final-${i+1}">${e(x.final_titulo_definitivo||x.titulo||'Sin título')}</a><br>${e(x.autor)}</div><div>${i+4}</div></div>`).join('')||'<p>Aún no se incorporaron trabajos finales.</p>';return page(`<div class="texto"><h2>Contenido</h2><h3>Trabajos Finales Integradores</h3>${f}</div>`,'Contenido',1)}
function meta(x){return `<p class="meta"><strong>Autoría:</strong> ${e(x.autor)}<br><strong>Organización:</strong> ${e(x.organizacion)}<br><strong>Sector:</strong> ${e(x.sector||'No especificado')}<br><strong>Palabras clave:</strong> ${e(x.palabrasClave||'No especificadas')}</p>`}
function field(t,v){return `<h3>${e(t)}</h3><p>${e(v||'No consignado')}</p>`}
function finalPage(x,i,n){return page(`<div class="texto" id="final-${i+1}"><p class="badge">Trabajo final</p><h2>${e(x.final_titulo_definitivo||x.titulo)}</h2>${meta(x)}${field('Síntesis del caso y del problema',x.final_sintesis)}${field('Tecnología habilitadora',x.final_tecnologia)}${field('Plan de transformación digital',x.final_plan)}${field('Justificación teórica',x.final_justificacion)}${field('Potencial de valor',x.final_valor)}${field('Requerimientos de inversión y gestión',x.final_requerimientos)}${field('Conclusiones',x.final_conclusiones)}${field('Bibliografía',x.final_bibliografia)}${media(x)}</div>`,'Trabajos finales',n)}
function renderLibroDesdeDatos(data){const fin=Array.isArray(data)?data:(data.finales||[]);let h=cover()+indice(fin)+intro();h+=fin.length?fin.map((x,i)=>finalPage(x,i,4+i)).join(''):page('<div class="texto"><h2>Trabajos Finales Integradores</h2><p>Aún no se incorporaron producciones.</p></div>','Trabajos finales',4);libro.innerHTML=h;}
function cargar(){if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(WEB_APP_URL)){libro.innerHTML='<div class="aviso">El libro está preparado. El equipo docente debe configurar la nueva URL de Google Apps Script para mostrar las producciones de esta edición.</div>';return}const script=document.createElement('script');script.src=WEB_APP_URL+'?callback=renderLibroDesdeDatos&tipo=todo&v='+Date.now();script.onerror=()=>{libro.innerHTML='<div class="aviso">No se pudieron recuperar las producciones. Verificá la conexión del libro con Google Sheets.</div>'};document.body.append(script)}cargar();</script></body></html>
